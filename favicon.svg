<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1e3d"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="txt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a1e0"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Subtle border glow -->
  <rect width="64" height="64" rx="14" fill="none" stroke="url(#txt)" stroke-width="1.5" opacity="0.4"/>
  <!-- RK text with gradient -->
  <text x="7" y="44" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="30"
        fill="url(#txt)" letter-spacing="-1" filter="url(#glow)">RK</text>
  <!-- Accent dot -->
  <circle cx="55" cy="42" r="4.5" fill="#00a1e0" opacity="0.9"/>
  <!-- Tiny inner highlight on dot -->
  <circle cx="53.8" cy="40.8" r="1.5" fill="#ffffff" opacity="0.5"/>
</svg>
